name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (dev + vips extras, pinned by ci/constraints.txt)
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,vips] -c ci/constraints.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy --strict)
        run: mypy --strict core clipshrink.py

      - name: Tests (pytest)
        run: python -m pytest -q

  # Same three gates on the other platforms. The vips extra is installed
  # here too: pyvips[binary] ships bundled-libvips wheels for macOS and
  # Windows, so the suite exercises the same backend surface everywhere.
  lint-typecheck-test-other-os:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install (dev + vips extras, pinned by ci/constraints.txt)
        run: |
          python -m pip install --upgrade pip
          pip install .[dev,vips] -c ci/constraints.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (mypy --strict)
        run: mypy --strict core clipshrink.py

      - name: Tests (pytest)
        run: python -m pytest -q
